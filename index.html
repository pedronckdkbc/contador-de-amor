<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contador de Amor</title>
  <style>
    body {
      margin: 0;
      background: #ffe6f0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      overflow: hidden;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #d10047;
      text-shadow: 1px 1px 2px #fff;
    }

    .heart-container {
      position: relative;
      width: 500px;
      height: 500px;
    }

    .flower {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: red;
      animation: float 4s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .counter {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #333;
      max-width: 250px;
      word-wrap: break-word;
    }

    .counter h2 {
      margin: 0;
      font-size: 18px;
      font-weight: bold;
    }

    .counter p {
      margin: 5px 0 0;
      font-size: 16px;
    }

    .music-button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #ff6699;
      border: none;
      color: white;
      font-size: 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .music-button:hover {
      background-color: #e05585;
    }

    .falling-heart {
      position: absolute;
      top: -20px;
      color: red;
      font-size: 20px;
      animation: fall 6s linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <audio id="bgMusic" loop>
    <source src="Nací Para Amarte.mp3" type="audio/mpeg">
    Tu navegador no soporta el elemento de audio.
  </audio>

  <div class="title">Para Nahomi 💖</div>

  <div class="heart-container" id="heart">
    <div class="counter">
      <h2>Me enamoré de ti<br>hace...</h2>
      <p id="timer">Cargando...</p>
    </div>
  </div>

  <button class="music-button" id="musicToggle">🎵 Reproducir música</button>

  <script>
    const heart = document.getElementById('heart');
    const music = document.getElementById('bgMusic');
    const toggleBtn = document.getElementById('musicToggle');

    for (let t = 0; t < Math.PI * 2; t += 0.05) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

      const flower = document.createElement('div');
      flower.className = 'flower';
      flower.style.left = `${250 + x * 10}px`;
      flower.style.top = `${230 - y * 10}px`;
      flower.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 70%)`;
      heart.appendChild(flower);
    }

    const startDate = new Date("2025-02-27T00:00:00");
    const timerElement = document.getElementById("timer");

    function updateTimer() {
      const now = new Date();
      let diff = Math.floor((now - startDate) / 1000);

      const days = Math.floor(diff / (60 * 60 * 24));
      diff %= 60 * 60 * 24;
      const hours = Math.floor(diff / 3600);
      diff %= 3600;
      const minutes = Math.floor(diff / 60);
      const seconds = diff % 60;

      timerElement.innerText = `${days} días ${hours.toString().padStart(2, '0')} horas ` +
        `${minutes.toString().padStart(2, '0')} minutos ${seconds.toString().padStart(2, '0')} segundos`;
    }

    setInterval(updateTimer, 1000);
    updateTimer();

    let isPlaying = false;
    toggleBtn.addEventListener('click', () => {
      if (isPlaying) {
        music.pause();
        toggleBtn.textContent = '🎵 Reproducir música';
      } else {
        music.play();
        toggleBtn.textContent = '⏸️ Pausar música';
      }
      isPlaying = !isPlaying;
    });

    // Animar corazones cayendo
    function createFallingHeart() {
      const heart = document.createElement('div');
      heart.className = 'falling-heart';
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (Math.random() * 10 + 16) + 'px';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(createFallingHeart, 500);
  </script>
</body>
</html>
